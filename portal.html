<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal - Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1 id="pageTitle">Student Portal Dashboard</h1>
    <button id="themeBtn">Toggle Theme</button>
  </header>

  <main>
    <section class="layout">
      <div class="card">
        <h2>Top Student</h2>
        <p id="topStudentName">Loading...</p>
        <p id="topStudentMarks"></p>
      </div>

      <div class="card">
        <h2>Controls</h2>
        <button id="hideBtn">Hide Table</button>
        <button id="titleBtn">Change Title</button>
      </div>
    </section>

    <section class="table-section">
      <h2>Student List</h2>
      <table id="studentTable">
        <tr>
          <th>Name</th>
          <th>Course</th>
          <th>Semester</th>
          <th>Marks</th>
        </tr>
      </table>
    </section>
  </main>

  <script src="scripts/portal.js"></script>
</body>
</html>
